[package]
name = "rust-font-manager"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Gestore desktop nativo di font per Windows 11 con attivazione GDI temporanea"
repository = "https://github.com/Dade00/rust-font-manager"

[dependencies]
iced = { version = "0.13.1", default-features = false, features = ["tiny-skia", "tokio", "advanced", "lazy"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures = "0.3"
walkdir = "2.5"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"
arboard = "3.4"
rfd = "0.15"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
skrifa = "0.30"
read-fonts = "0.28"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }
