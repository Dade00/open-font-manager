[package]
name = "rust-font-manager"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Core Rust per Open Font Manager, applicazione desktop Windows con installazione font persistente per utente"
repository = "https://github.com/Dade00/open-font-manager"
license = "MIT"

[workspace]
members = ["src-tauri"]
resolver = "2"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures = "0.3"
walkdir = "2.5"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"
sha2 = "0.11"
thiserror = "2"
tracing = "0.1"
skrifa = "0.30"
read-fonts = "0.28"
tempfile = "3"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
image = { version = "=0.24.9", default-features = false, features = ["png", "jpeg", "webp"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56"
