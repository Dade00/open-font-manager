[package]
name = "open-font-manager-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Open Font Manager desktop app built with Tauri"
license = "MIT"
repository = "https://github.com/Dade00/open-font-manager"

[lib]
name = "open_font_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
rust-font-manager = { path = ".." }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
